name: Build Sakuin APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/android/**'
      - 'apps/web/src/**'
      - 'apps/web/capacitor.config.ts'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App
        run: pnpm --filter @sakuin/web build

      - name: Sync Capacitor Android
        run: |
          cd apps/web
          npx cap sync android

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # Tulis keystore jika secrets tersedia
      - name: Decode Android Keystore
        run: |
          if [ ! -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/web/android/app/release.keystore
            echo "Keystore successfully decoded and placed."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found. Will build unsigned APK."
          fi
        shell: bash

      - name: Build Release APK
        run: |
          cd apps/web/android
          ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakuin-release-apk
          path: |
            apps/web/android/app/build/outputs/apk/release/app-release.apk
            apps/web/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
