name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: pnpm install
        working-directory: ./apps/web

      - name: Build Web App
        run: pnpm run build
        working-directory: ./apps/web

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: ./apps/web

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Note: Untuk signing APK, Anda perlu menambahkan secrets (KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD)
      # dan men-decode keystore sebelum build. 
      # Dokumentasi: https://docs.github.com/en/actions/deployment/deploying-to-your-cloud-provider/deploying-to-google-play
      # Untuk sementara, kita build release unsigned atau membiarkan build gradle mencari release.keystore lokal jika tidak di-ignore.

      - name: Build Release APK
        run: ./gradlew assembleRelease
        working-directory: ./apps/web/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk
