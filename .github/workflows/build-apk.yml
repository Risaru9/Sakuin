name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Production safety check
        run: pnpm safety:production

      - name: Typecheck Shared Contracts
        run: pnpm --filter @sakuin/shared typecheck

      - name: Typecheck Web App
        run: pnpm --filter @sakuin/web typecheck

      - name: Test Web App
        run: pnpm --filter @sakuin/web test

      - name: Build Web App
        run: pnpm --filter @sakuin/web build

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: ./apps/web

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Signing secrets: ANDROID_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS,
      # SIGNING_KEY_PASSWORD (see docs/APK_UPDATE_FLOW.md). Without them the APK is unsigned.
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; building an unsigned release APK."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakuin-release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/sakuin-release.keystore" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        working-directory: ./apps/web/android

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sakuin-release.keystore"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: apps/web/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
