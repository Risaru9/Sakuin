name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Sakuin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      FRONTEND_URL: http://localhost:3000
      VITE_API_BASE_URL: http://127.0.0.1:5000
      SAKUIN_DATABASE_TARGET: test
      SAKUIN_PRODUCTION_DATABASE_PROJECT_REF: bwzxtjgrerjimcuyslci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CI database safety
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "CI_DATABASE_URL is missing. Configure it in GitHub Actions secrets."
            exit 1
          fi

          if [ -z "${DIRECT_URL:-}" ]; then
            echo "CI_DIRECT_URL is missing. Configure it in GitHub Actions secrets."
            exit 1
          fi

          if [ "${SAKUIN_DATABASE_TARGET:-}" != "test" ]; then
            echo "SAKUIN_DATABASE_TARGET must be test in CI."
            exit 1
          fi

          if [[ "${DATABASE_URL}" == *"${SAKUIN_PRODUCTION_DATABASE_PROJECT_REF}"* ]]; then
            echo "DATABASE_URL points to the production database. CI must use the test database."
            exit 1
          fi

          if [[ "${DIRECT_URL}" == *"${SAKUIN_PRODUCTION_DATABASE_PROJECT_REF}"* ]]; then
            echo "DIRECT_URL points to the production database. CI must use the test database."
            exit 1
          fi

          echo "CI database safety check passed."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @sakuin/api db:generate

      - name: Production safety check
        run: pnpm safety:production

      - name: Sync CI database schema
        run: pnpm --filter @sakuin/api exec prisma db push --skip-generate

      - name: Shared typecheck
        run: pnpm --filter @sakuin/shared typecheck

      - name: Frontend test
        run: pnpm --filter @sakuin/web test

      - name: Frontend typecheck
        run: pnpm --filter @sakuin/web typecheck

      - name: Frontend build
        run: pnpm --filter @sakuin/web build

      - name: Backend typecheck
        run: pnpm --filter @sakuin/api typecheck

      - name: Backend test
        # Integration tests share one remote CI database. Running files serially
        # avoids connection contention and non-deterministic query timeouts.
        run: pnpm --filter @sakuin/api test:ci

      - name: Backend build
        run: pnpm --filter @sakuin/api build
