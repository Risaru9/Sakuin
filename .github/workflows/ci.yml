name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Sakuin
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      FRONTEND_URL: http://localhost:3000
      VITE_API_BASE_URL: http://127.0.0.1:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @sakuin/api db:generate

      - name: Sync CI database schema
        run: pnpm --filter @sakuin/api exec prisma db push --skip-generate

      - name: Frontend test
        run: pnpm --filter @sakuin/web test

      - name: Frontend typecheck
        run: pnpm --filter @sakuin/web typecheck

      - name: Frontend build
        run: pnpm --filter @sakuin/web build

      - name: Backend typecheck
        run: pnpm --filter @sakuin/api typecheck

      - name: Backend test
        run: pnpm --filter @sakuin/api test

      - name: Backend build
        run: pnpm --filter @sakuin/api build