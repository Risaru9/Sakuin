<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0c1a" />
    <title>Sakuin Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8f4ec;
        color: #0f0c1a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(124, 58, 237, 0.12), transparent 34%),
          radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.10), transparent 36%),
          #f8f4ec;
      }

      .card {
        width: min(100%, 460px);
        border: 1px solid rgba(15, 12, 26, 0.10);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(15, 12, 26, 0.12);
        padding: 28px;
        text-align: center;
      }

      .icon {
        width: 64px;
        height: 64px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        background: #0f0c1a;
        color: white;
        font-size: 28px;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      p {
        margin: 14px 0 0;
        color: #6b6478;
        line-height: 1.7;
        font-size: 15px;
      }

      button {
        margin-top: 22px;
        min-height: 48px;
        border: 0;
        border-radius: 18px;
        background: #0f0c1a;
        color: white;
        padding: 0 22px;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: #000000;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">S</div>
      <h1>Sakuin sedang offline</h1>
      <p>
        Koneksi internet tidak tersedia. Halaman aplikasi mungkin belum bisa
        mengambil data terbaru dari server. Coba sambungkan internet lalu muat ulang.
      </p>
      <button type="button" onclick="window.location.reload()">Muat ulang</button>
    </main>
  </body>
</html>
