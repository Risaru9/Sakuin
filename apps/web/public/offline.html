<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Sakuin Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #ffffff;
        color: #0b0b0b;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #ffffff;
      }

      .card {
        width: min(100%, 460px);
        border: 1px solid rgba(37, 99, 235, 0.16);
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 8px 8px 0 #dbeafe;
        padding: 28px;
        text-align: center;
      }

      .icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        margin: 0 auto 18px;
        display: block;
        background: #ffffff;
        border: 1px solid rgba(37, 99, 235, 0.16);
        object-fit: cover;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 14px 0 0;
        color: #52525b;
        line-height: 1.7;
        font-size: 15px;
      }

      button {
        margin-top: 22px;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: #2563eb;
        color: white;
        padding: 0 22px;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icons/sakuin-logo.png" alt="Sakuin" />
      <h1>Sakuin sedang offline</h1>
      <p>
        Koneksi internet tidak tersedia. Halaman aplikasi mungkin belum bisa
        mengambil data terbaru dari server. Coba sambungkan internet lalu muat ulang.
      </p>
      <button type="button" onclick="window.location.reload()">Muat ulang</button>
    </main>
  </body>
</html>
