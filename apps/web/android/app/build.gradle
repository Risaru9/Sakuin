apply plugin: 'com.android.application'

// Release signing comes from environment variables (CI) or android/keystore.properties (local).
// Neither the keystore nor its passwords may be committed; see docs/APK_UPDATE_FLOW.md.
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("keystore.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { stream -> signingProperties.load(stream) }
}
def signingValue = { String envName, String propertyName ->
    System.getenv(envName) ?: signingProperties.getProperty(propertyName)
}
def releaseStoreFile = signingValue("SIGNING_STORE_FILE", "storeFile")
def releaseStorePassword = signingValue("SIGNING_STORE_PASSWORD", "storePassword")
def releaseKeyAlias = signingValue("SIGNING_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = signingValue("SIGNING_KEY_PASSWORD", "keyPassword")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.sakuin.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sakuin.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "2.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("Release signing is not configured; building an unsigned release APK.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.register("removeBundledApkDownload") {
    doLast {
        delete file("src/main/assets/public/downloads/sakuin.apk")
    }
}

tasks.matching { task ->
    task.name == "mergeDebugAssets" || task.name == "mergeReleaseAssets" || task.name.matches("merge.*Assets")
}.configureEach {
    dependsOn(tasks.named("removeBundledApkDownload"))
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
